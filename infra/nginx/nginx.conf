worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;
    log_format safe '$request_id $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $upstream_http_x_request_id $hub_request_id {
        default $upstream_http_x_request_id;
        "" $request_id;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Request-ID $hub_request_id always;
        add_header Cache-Control no-store always;

        error_page 400 401 403 405 408 411 414 415 416 421 429 431 494 495 496 497 /errors/request.html;
        error_page 404 /errors/not-found.html;
        error_page 413 /errors/too-large.html;
        error_page 500 501 502 503 504 /errors/unavailable.html;

        location ~ ^/(api|health|metrics)(/|$) {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header X-Request-ID;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Cache-Control;
            # Backend responses already use the safe JSON contract.
            proxy_intercept_errors off;
            error_page 400 401 403 404 405 408 411 414 415 416 421 429 431 494 495 496 497 = @api_request_error;
            error_page 413 = @api_too_large;
            error_page 500 501 502 503 504 = @api_unavailable;
        }
        include /etc/nginx/api-errors.conf;

        location /errors/ { internal; }
        location / { try_files $uri $uri/ =404; }
    }
}
